<html>
    <head>
        <title>Login Page</title>
        <style>
            *{
                font-family: segoe ui light ;
            }
            body{
                min-height: 100vh;
                margin: 0;
                background: linear-gradient(to bottom, #b59ede, #ae0a0a);
            }
            #wrapper{
            display: flex;
            justify-content: center;
            gap: 40px; /* space between boxes */
            margin-top: 100px;
        }

.container{
    width: 450px;
    height: 400px;
    background-color: rgb(240, 234, 234);
    border-radius: 40px;
    display: flex;   
    overflow: hidden;
}

.left, .right{
    width: 50%;
    padding: 20px;
}

.right{
    background: #a81818;
    color: white;

    display: flex;
    justify-content: center;  
    align-items: center;      
    text-align: center;       
    flex-direction: column;   
    font-family: monospace;
    font-size: 20px;
}
.right p{
    display: inline;
    gap: 10px;
}

            
           #container h1{
                padding-top: 30px;
                padding-bottom: 20px;
            }
            .form-control{
                margin-bottom: 30px;
            }
            .form-control input{
                padding-top: 15px;
                padding-bottom: 15px;
                border-radius: 20px;
                background-color:#A7FFEB;
               
                
                
            }
            .form-control button{
                margin-top: 10px;
                padding: 10px 20px;
                width: 75%;
                background: #0f81b7;     /* blue */
                border-radius: 15px;
                border: 2px solid #0f81b7;
                color: white;
                cursor: pointer;
                transition: 0.3s ease;
            }
                    .form-control button:hover{
                background: white;
                color: #0f81b7;
            }
            a{
                text-decoration: none;
            }
            .right button{
                padding: 10px 25px;
                background: transparent;
                border: 2px solid white;
                color: white;
                border-radius: 25px;   /* pill shape */
                cursor: pointer;
                font-weight: 500;
                transition: 0.3s ease;
            }
            .right button:hover{
                background: white;
                color: #0f81b7;
            }

        </style>
    </head>
    <body>
        <body>
    <div id="wrapper">
        <div class="container">
    <div class="left">
        <h1><b>Sign in</b></h1>
        <form>
            <div class="form-control">
                <input type="text" placeholder="Email">
            </div>
            <div class="form-control">
                <input type="password" placeholder="Password">
            </div>
            <div class="form-control">
                <button type="submit">SIGN IN</button>
            </div>
        </form>
        <p>Need Account? <a href="#">Sign Up</a></p>
    </div>

    <div class="right">
        
        <h1><b>Create,<br>
        Account!</b></h1>
        <p>Sign up if you don't have an account..</p>
        <div><button type="submit">SIGN UP</button></div>
        
    </div>
    
</div>
</body>
    </body>
</html>
