<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lamborghini</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>


<nav class="navbar">
  <div class="logo"><img src="/images/logo.png" alt="Lamborghini">
</div>

  <ul class="nav-links">
    <li><a href="#">Home</a></li>

    <li class="dropdown">
      <a href="#">More</a>
      <ul class="dropdown-menu">
        <li><a href="#gallery">About</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </li>

    <li><a href="/signup7.html">Sign Up</a></li>
    <li><a href="/signup7.html">Sign In</a></li>
  </ul>

  <div class="menu-icon">☰</div>
</nav>


<section class="hero">
  <img src="/Car Edit Photos.jpg" alt="">
  <img src="/Car Edit Photos.jpg" alt="">
  <img src="/Car Edit Photos.jpg" alt="">
  <img src="/Car Edit Photos.jpg" alt="">
  <div class="hero-text">
    <h1>Lamborghini</h1>
    <p>Luxury. Speed. Power.</p>
  </div>
</section>


<div class="scroll-text">
  <marquee>Welcome to Lamborghini Experience</marquee>
</div>


<section class="gallery" id="gallery">
  <h2>Our Models</h2>

  <div class="gallery-container">
    <div class="card">
      <img src="/images/download.jpg" alt="Aventador">
      <h3>Revuelto</h3>
    </div>

    <div class="card">
      <img src="/images/@amazingsupercar LAMBORGHINI HURACAN.jpg">
<html>
      <h3>Urus SE</h3>
    </div>

    <div class="card">
      <img src="/images/download (1).jpg">
      <h3>Temerario</h3>
    </div>
  </div>
</section>

<section class="contact" id="contact">
  <h2>Contact Us</h2>
  
  <div class="contact-container">
    <form>
      <input type="text" placeholder="Your Name" required>
      <input type="email" placeholder="Your Email" required>
      <textarea placeholder="Your Message" required></textarea>
      <button type="submit">Send Message</button>
    </form>
  </div>
</section>

<!-- FOOTER -->
<footer>

</footer>

<script>
  const menuIcon = document.querySelector(".menu-icon");
  const navLinks = document.querySelector(".nav-links");

  menuIcon.onclick = () => {
    navLinks.classList.toggle("active");
  };

  
</script>

</body>
</html>
