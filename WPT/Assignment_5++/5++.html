<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cat Gallery</title>

  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5 text-center">

  <h1 class="mb-4">Random Cat Gallery</h1>

  <button class="btn btn-primary mb-4" onclick="getCats()">Load page</button>


  <div id="loader" class="d-none">
    <div class="spinner-border text-primary"></div>
  </div>

  
  <div id="error" class="alert alert-danger d-none"></div>

 
  <div id="results" class="row g-4"></div>

</div>

<script >const loader = document.getElementById("loader");
const errorDiv = document.getElementById("error");
const results = document.getElementById("results");

async function getCats() {
    results.innerHTML = "";
    errorDiv.classList.add("d-none");

    try {
        loader.classList.remove("d-none");

        const res = await fetch("https://api.thecatapi.com/v1/images/search?limit=6");
        const data = await res.json();

        loader.classList.add("d-none");

        data.forEach(cat => {
            const col = document.createElement("div");
            col.className = "col-md-4";

            col.innerHTML = `
                <div class="card shadow">
                    <img src="${cat.url}" class="card-img-top">
                </div>
            `;

            results.appendChild(col);
        });

    } catch (err) {
        loader.classList.add("d-none");
        errorDiv.classList.remove("d-none");
        errorDiv.innerText = "Failed to load cats!";
    }
}</script>
</body>
</html>
