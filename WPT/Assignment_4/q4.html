<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>q4</title>
</head>
<body>
    <script>
              function fetchData(callback) {
                    console.log("Fetching data...");
                    setTimeout(() => {
                        const error = false;
                        if (error) {
                            callback("Error: Failed to fetch data", null);
                        } else {
                            const response = { id: 1, name: "Shivraj" };
                            callback(null, response);
                        }
                    }, 2000);
                }

                fetchData((err, data) => {
                    if (err) {
                        console.error(err);
                    } else {
                        console.log("Data received:", data);
                    }
                });
    </script>
</body>
</html>
