<!DOCTYPE html>
<html lang="en">
<head>
    <title>Sign Up</title>
    <style>
    body {
        background-color: #eee;
        font-family: Arial, sans-serif;
    }

    .container {
        background: white;
        width: 320px;
        margin: 60px auto;
        padding: 30px;
        text-align: center;
        border: 2px solid #4a90e2;
    }

    h2 {
        margin-bottom: 20px;
    }

    input {
        width: 100%;
        border: none;
        border-bottom: 1px solid gray;
        margin: 15px 0;
        padding: 8px;
        outline: none;
    }

    input:focus {
        border-bottom: 2px solid #4a90e2;
    }

    .login-text {
        font-size: 12px;
        color: gray;
    }

    .login-text span {
        color: black;
        font-weight: bold;
        cursor: pointer;
    }

    button {
        width: 70%;
        padding: 10px;
    
        background: black;
        color: white;
        border: none;
        margin-top: 15px;
        cursor: pointer;
        
    }

    .error {
        color: red;
        font-size: 12px;
        margin-top: 15px;
    }
</style>
</head>
<body>
    
    <div class="container">
            <h2>Sign Up</h2>

        <input type="text" placeholder="First Name">
        <input type="text" placeholder="Last Name">
        <input type="email" placeholder="Email">
        <input type="password" placeholder="Password">

        <p class="login-text">Already a member? <span>Log In</span></p>

        <button>Sign Up</button>

        <p class="error">If an error occurs when filling a form, a message will show here.</p>


    </div>



</body>
</html>
